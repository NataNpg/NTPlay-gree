name: APK Android TV (NTPlay-gree)
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'min_version'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (Kotlin + Compose + libVLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Número da versão (sobe sozinho a cada compilação)
        run: echo "NT_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Chave do TMDB (Secret opcional — capas/sinopses oficiais)
        env:
          TK: ${{ secrets.TMDB_KEY }}
        run: echo "TMDB_KEY=$TK" >> "$GITHUB_ENV"
      - name: Assinatura (opcional — sem Secret, usa a chave debug)
        env:
          KS_B64: ${{ secrets.NT_GREE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NT_GREE_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ntgree-release.jks"
            echo "NT_KS_FILE=$RUNNER_TEMP/ntgree-release.jks" >> "$GITHUB_ENV"
            echo "NT_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Assinando com a chave fixa dos Secrets."
          else
            echo "Sem NT_GREE_KEYSTORE_B64/NT_GREE_KS_PASS: compilando com a chave debug (instala e roda; para atualizar por cima no futuro, crie uma chave fixa)."
          fi
      - name: Compilar APK
        shell: bash
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > gradle.log 2>&1
          code=$?
          tail -n 40 gradle.log
          if [ $code -ne 0 ]; then
            echo "::error title=gradle falhou::$(grep -E '^e: |error:|What went wrong|Caused by|FAILED|Dependency |minSdk|minCompileSdk|requires|Could not' -A2 gradle.log | head -c 3500 | tr '\n' '|')"
            exit $code
          fi
      - run: cp app/build/outputs/apk/release/app-release.apk NTPlay-gree.apk
      - name: Arquivo de versão (usado pela atualização automática do app)
        run: |
          code=$NT_VERSION_CODE
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          min=$(tr -d '[:space:]' < min_version)
          echo "{\"code\":$code,\"name\":\"$name\",\"min\":${min:-0}}" > tv-version.json
          cat tv-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: NTPlay-gree
          path: NTPlay-gree.apk
      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest NTPlay-gree.apk tv-version.json --title "NTPlay-gree (Android TV)" --notes "APK para Android TV (motor libVLC). Baixe NTPlay-gree.apk abaixo." --target ${{ github.sha }}
